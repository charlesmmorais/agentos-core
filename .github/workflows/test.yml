name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o agentos ./cmd/agentos
      - run: python3 -m unittest discover -s tests -v
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go build -o agentos ./cmd/agentos
      - name: Test actual Docker isolation
        shell: bash
        run: |
          docker pull python:3.12-slim
          export AGENTOS_SANDBOX_IMAGE="$(docker image inspect --format '{{.Id}}' python:3.12-slim)"
          python3 -m unittest discover -s tests -p test_sandbox.py -v
          python3 -m unittest discover -s tests -p test_retrieval.py -v
          test -z "$(docker ps -aq --filter 'name=agentos-')"
